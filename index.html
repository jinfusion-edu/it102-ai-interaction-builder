<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Week 3 Assignment: Dynamic Greeting</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; background: #f4f4f9; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; }
        input, button { width: 100%; padding: 0.5rem; margin: 0.5rem 0; box-sizing: border-box; }
        button { background: #0076ff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #output { margin-top: 1rem; font-weight: bold; color: #333; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Interactive Greeter</h2>
        <label for="userName">Enter your name:</label>
        <input type="text" id="userName" placeholder="e.g., Alex">

        <label for="timeOfDay">Time of day:</label>
        <input type="text" id="timeOfDay" placeholder="e.g., morning, afternoon, evening">

        <button id="greetBtn">Generate Greeting</button>

        <p id="output"></p>
    </div>

    <script>
        /* ================================================================
           PART 1 — the AI-generated function.
           Requested via the prompt recorded in README.md. It returns a
           string and touches no DOM, exactly as the prompt demanded.
           ================================================================ */
        function generateCustomGreeting(name, time) {
            // The assignment requires "day" when no time is provided.
            //
            // A default parameter (time = "day") is NOT enough here: an empty
            // text input hands us the empty string "", and a default only
            // fires for `undefined`. So we test the value itself.
            var timeOfDay = time;

            if (timeOfDay === undefined || timeOfDay === null || String(timeOfDay).trim() === "") {
                timeOfDay = "day";
            }

            return "Good " + timeOfDay + ", " + name + "! Welcome back to JavaScript class.";
        }

        /* ================================================================
           PART 2 — the event listener. Written by hand, not by the AI,
           because wiring the DOM is the skill this assignment is testing.
           ================================================================ */

        // Step 1: select the elements.
        var nameInput = document.getElementById("userName");
        var timeInput = document.getElementById("timeOfDay");
        var greetButton = document.getElementById("greetBtn");
        var outputParagraph = document.getElementById("output");

        // Step 2: listen for the click.
        greetButton.addEventListener("click", function () {
            // Step 3: capture the current text of both inputs.
            var enteredName = nameInput.value;
            var enteredTime = timeInput.value;

            // Call the AI function, passing the captured values as arguments.
            var greeting = generateCustomGreeting(enteredName, enteredTime);

            // Write the returned string into the paragraph.
            outputParagraph.textContent = greeting;
        });
    </script>
</body>
</html>
